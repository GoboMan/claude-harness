# Interface contract (OpenAPI 3.1) — one feature, one file
# With spec.md in the same directory this forms the feature's MIS (holds only the shape of the boundary; behavior and rules live in the spec)
# Placeholders (F-000 / YYYY-MM-DD / <...>) must be replaced with real values before it is marked fixed
# Never write purpose, business rules, or UI explanations into info.description / operation.description (→ spec.md)
# Write summary and description text in Japanese
openapi: 3.1.0
info:
  title: F-000 <機能名>
  version: 1.0.0
x-feature-id: F-000          # must match the ID part of the directory name F-000-<slug>
x-status: draft              # draft | fixed (the caller marks it fixed; never do it yourself)
x-spec: ./spec.md            # the behavioral SSOT (authoritative for purpose, rules, and GWT)
x-updated: YYYY-MM-DD

paths:
  /xxx:                      # the call site (for non-REST, express the action name as a path)
    post:
      operationId: f000Xxx
      summary: <何をするか 1 行>   # one line only; no detailed explanation
      security:
        - session: []        # state security: [] explicitly when no auth is required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [i_xxx]
              properties:
                i_xxx:
                  type: string
                  minLength: 1
                  maxLength: 255
                  # description is a short note on the wire constraint only (business meaning and rules live in the spec)
            examples:
              ok:
                value: { i_xxx: "abc" }
      responses:
        "200":
          description: 正常
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: integer }
                  status: { type: string, const: ok }
              examples:
                ok:
                  value: { id: 1, status: ok }
        "400":
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: "../_shared/components.yaml#/components/schemas/Error"
              examples:
                invalid:
                  value: { code: INVALID_INPUT, message: "i_xxx は必須です" }
        "403":
          description: 権限なし
          content:
            application/json:
              schema:
                $ref: "../_shared/components.yaml#/components/schemas/Error"

components:
  securitySchemes:
    session:                 # the name used in security must be defined in this file; the definition itself is referenced from _shared
      $ref: "../_shared/components.yaml#/components/securitySchemes/session"
