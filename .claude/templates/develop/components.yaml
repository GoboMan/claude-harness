# docs/specs/_shared/components.yaml — the contracts' shared vocabulary ($ref targets)
# What may go here: only what 2+ features use (the error shape, error codes, the auth scheme, shared DTOs)
# A schema used by only one feature is written inline in that contract (never here)
# Only the orchestrator writes here. Concurrent producers never append; they report the vocabulary they want added
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
    ErrorCode:
      type: string
      enum: [INVALID_INPUT, FORBIDDEN, NOT_FOUND]
